services:
  # Legacy Flask (client_app/company_app) - keep for old generation
  - type: web
    name: securestaff-flask
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    branch: master
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
  # New RBM Platform (client/tracker/backend) - Node
  - type: web
    name: securestaff
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    branch: master
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: TRACKER_ID
        value: rbmbaleshgoud
      - key: TRACKER_PASS
        value: bindu@goud0319
      - key: OTP_SINGLE_NUMBER
        value: +919949811742
      - key: OTP_PROVIDER
        value: demo
      - key: PORT
        value: 10000
    healthCheckPath: /api/health
