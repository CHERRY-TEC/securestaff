<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Post Job - SecureStaff</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #e0e5ec; min-height: 100vh; }
        nav { background: #e0e5ec; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 4px 4px 10px #b8bec7, -4px -4px 10px #ffffff; position: sticky; top: 0; z-index: 100; }
        nav .logo { font-size: 20px; font-weight: 700; color: #16213e; }
        nav .logo span { color: #e94560; }
        nav .links a { color: #555; text-decoration: none; margin-left: 20px; font-size: 14px; }
        nav .links a:hover { color: #e94560; }
        nav .links .logout { background: #e94560; color: #fff; padding: 8px 18px; border-radius: 10px; box-shadow: 4px 4px 10px #b8bec7, -4px -4px 10px #ffffff; }
        .container { max-width: 500px; margin: 40px auto; padding: 0 20px; }
        .card { padding: 30px; background: #e0e5ec; border-radius: 16px; box-shadow: 8px 8px 16px #b8bec7, -8px -8px 16px #ffffff; }
        .card h2 { color: #16213e; margin-bottom: 6px; }
        .card .sub { color: #888; font-size: 14px; margin-bottom: 24px; }
        input, textarea { background: #e0e5ec; border: none; border-radius: 10px; box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff; padding: 12px 16px; font-size: 14px; outline: none; width: 100%; margin-bottom: 16px; font-family: inherit; }
        input::placeholder, textarea::placeholder { color: #aaa; }
        input:focus, textarea:focus { box-shadow: inset 6px 6px 12px #b8bec7, inset -6px -6px 12px #ffffff; }
        .btn { width: 100%; padding: 14px; background: #e0e5ec; border: none; border-radius: 12px; box-shadow: 6px 6px 12px #b8bec7, -6px -6px 12px #ffffff; font-size: 16px; font-weight: 600; cursor: pointer; color: #e94560; transition: all 0.2s; }
        .btn:active { box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff; }
        .back { display: inline-block; margin-top: 16px; color: #888; text-decoration: none; font-size: 14px; }
        .back:hover { color: #e94560; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Secure<span>Staff</span></div>
        <div class="links">
            <a href="/dashboard">Dashboard</a>
            <a href="/post">Post Job</a>
            <a href="/logout" class="logout">Logout</a>
        </div>
    </nav>
    <div class="container">
        <div class="card">
            <h2>Post a Security Job</h2>
            <p class="sub">Describe your security requirements</p>
            <form method="post">
                <input name="title" placeholder="Job Title (e.g. Night Guard, Event Security)" required>
                <input name="location" placeholder="Location">
                <textarea name="description" placeholder="Description / Requirements" rows="4"></textarea>
                <button class="btn" type="submit">Submit Job Request</button>
            </form>
            <a href="/dashboard" class="back">&larr; Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
