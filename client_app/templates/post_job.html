<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Post Job - SecureStaff</title>
    <style>
        body { font-family: Arial, sans-serif; background: #16213e; margin: 0; }
        header { background: #16213e; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .box { max-width: 460px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        input, textarea { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        .btn { background: #0f3460; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; }
        a { color: #0f3460; }
    </style>
</head>
<body>
    <header>
        <h2>Post a Job</h2>
        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/post">Post Job</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>
    <div class="box">
        <h3>New Security Job Request</h3>
        <form method="post">
            <input name="title" placeholder="Job Title (e.g. Night Guard, Event Security)" required>
            <input name="location" placeholder="Location">
            <textarea name="description" placeholder="Description / Requirements" rows="4"></textarea>
            <button class="btn" type="submit">Post Job</button>
        </form>
        <p><a href="/dashboard">Back to Dashboard</a></p>
    </div>
</body>
</html>
