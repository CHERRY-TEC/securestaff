<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Client Login - SecureStaff</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #16213e, #1a1a2e); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { max-width: 400px; width: 90%; background: #fff; padding: 36px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .box .icon { text-align: center; margin-bottom: 16px; }
        .box .icon span { display: inline-block; width: 60px; height: 60px; background: linear-gradient(135deg, #0f3460, #16213e); border-radius: 50%; line-height: 60px; font-size: 28px; color: #fff; }
        .box h2 { text-align: center; color: #16213e; margin-bottom: 6px; }
        .box .sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.3s; }
        .form-group input:focus { border-color: #0f3460; }
        .btn { width: 100%; padding: 13px; background: #0f3460; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #1a5276; }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #0f3460; text-decoration: none; font-size: 14px; }
        .links a:hover { text-decoration: underline; }
        .msg { background: #ffe6e6; color: #c0392b; padding: 10px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon"><span>&#128100;</span></div>
        <h2>Client Login</h2>
        <p class="sub">Login to manage your security requests</p>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="msg">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <form method="post">
            <div class="form-group">
                <input name="email" type="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input name="password" type="password" placeholder="Password" required>
            </div>
            <button class="btn" type="submit">Login</button>
        </form>
        <div class="links">
            <a href="/register">Register</a> | <a href="/">Back</a>
        </div>
    </div>
</body>
</html>
