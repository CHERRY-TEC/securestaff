<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login - SecureStaff</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
        .box { max-width: 360px; margin: 60px auto; background: #fff; padding: 24px;
               border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        input, select { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        .btn { background: #1f2d3d; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; }
        .msg { color: #c0392b; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Login</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<p class="msg">{{ messages[0] }}</p>{% endif %}
        {% endwith %}
        <form method="post">
            <input name="email" type="email" placeholder="Email" required>
            <input name="password" type="password" placeholder="Password" required>
            <button class="btn" type="submit">Login</button>
        </form>
        <p><a href="{{ url_for('auth.register', role='worker') }}">Register</a></p>
    </div>
</body>
</html>
