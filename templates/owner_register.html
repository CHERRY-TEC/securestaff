<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Owner Register - SecureStaff</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
        .box { max-width: 420px; margin: 40px auto; background: #fff; padding: 24px;
               border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        .btn { background: #27ae60; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .msg { color: #c0392b; }
        a { color: #27ae60; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Register as Owner</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<p class="msg">{{ messages[0] }}</p>{% endif %}
        {% endwith %}
        <form method="post">
            <input name="name" placeholder="Full Name" required>
            <input name="email" type="email" placeholder="Email" required>
            <input name="password" type="password" placeholder="Password" required>
            <input name="phone" placeholder="Phone">
            <button class="btn" type="submit">Register</button>
        </form>
        <p><a href="{{ url_for('auth.owner_login') }}">Already have an account? Login</a></p>
    </div>
</body>
</html>
