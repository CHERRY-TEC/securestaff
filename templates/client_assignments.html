<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Assignments - SecureStaff</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
        header { background: #2c3e50; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 14px; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1000px; margin: 24px auto; padding: 0 20px; }
        .card { background: #fff; padding: 18px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
        .badge { padding: 2px 8px; border-radius: 3px; font-size: 12px; color: #fff; }
        .badge-pending { background: #8e44ad; }
        .badge-accepted { background: #27ae60; }
        .badge-declined { background: #c0392b; }
    </style>
</head>
<body>
    <header>
        <h2>Your Assignments</h2>
        <nav>
            <a href="{{ url_for('main.client_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('main.client_post_job') }}">Post Job</a>
            <a href="{{ url_for('main.client_assignments') }}">Assignments</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        </nav>
    </header>
    <div class="container">
        <div class="card">
            <h3>All Assignments ({{ assignments|length }})</h3>
            <table>
                <tr><th>Job</th><th>Location</th><th>Worker</th><th>Phone</th><th>Status</th></tr>
                {% for a in assignments %}
                <tr>
                    <td>{{ a.job.title }}</td>
                    <td>{{ a.job.location }}</td>
                    <td>{{ a.worker.name }}</td>
                    <td>{{ a.worker.phone }}</td>
                    <td><span class="badge badge-{{ a.status }}">{{ a.status }}</span></td>
                </tr>
                {% else %}<tr><td colspan="5">No assignments yet.</td></tr>{% endfor %}
            </table>
        </div>
    </div>
</body>
</html>
