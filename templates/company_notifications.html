<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Notifications - SecureStaff</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
        header { background: #1a1a2e; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 14px; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 900px; margin: 24px auto; padding: 0 20px; }
        .card { background: #fff; padding: 18px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 16px; }
        .notif { background: #fff; border-left: 4px solid #27ae60; padding: 12px; margin: 8px 0; border-radius: 4px; }
        .notif.unread { background: #fff3cd; border-left-color: #e94560; }
    </style>
</head>
<body>
    <header>
        <h2>Notifications</h2>
        <nav>
            <a href="{{ url_for('main.company_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('main.company_notifications') }}">Notifications</a>
            <a href="{{ url_for('main.company_clients') }}">Clients</a>
            <a href="{{ url_for('main.company_workers') }}">Workers</a>
            <a href="{{ url_for('main.company_jobs') }}">Jobs</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        </nav>
    </header>
    <div class="container">
        <div class="card">
            <h3>All Notifications ({{ notifications|length }})</h3>
            {% for n in notifications %}
            <div class="notif {% if not n.is_read %}unread{% endif %}">
                <strong>{{ n.title }}</strong> — <small>{{ n.created_at.strftime('%d %b %Y, %H:%M') }}</small>
                <p>{{ n.message }}</p>
            </div>
            {% else %}
            <p>No notifications yet.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
