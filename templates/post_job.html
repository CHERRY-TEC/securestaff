<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Post Job - SecureStaff</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
        .box { max-width: 460px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        input, textarea { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        .btn { background: #1f2d3d; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Post a Security Job</h2>
        <form method="post">
            <input name="title" placeholder="Job Title (e.g. Night Guard)" required>
            <input name="location" placeholder="Location">
            <textarea name="description" placeholder="Description / Requirements"></textarea>
            <button class="btn" type="submit">Post Job</button>
        </form>
        <p><a href="{{ url_for('main.company_dashboard') }}">Back</a></p>
    </div>
</body>
</html>
