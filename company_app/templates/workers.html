<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Workers - SecureStaff</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
        header { background: #1a1a2e; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 14px; }
        .container { max-width: 900px; margin: 24px auto; padding: 0 20px; }
        .card { background: #fff; padding: 18px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
        .btn { background: #e94560; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <h2>Workers</h2>
        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/notifications">Notifications</a>
            <a href="/clients">Clients</a>
            <a href="/workers">Workers</a>
            <a href="/jobs">Jobs</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>
    <div class="container">
        <div class="card">
            <a class="btn" href="/add-worker">+ Add Worker</a>
        </div>
        <div class="card">
            <h3>Security Workers ({{ workers|length }})</h3>
            <table>
                <tr><th>Name</th><th>Email</th><th>Phone</th><th>Skills</th></tr>
                {% for w in workers %}
                <tr>
                    <td>{{ w.name }}</td>
                    <td>{{ w.email }}</td>
                    <td>{{ w.phone }}</td>
                    <td>{{ w.skills }}</td>
                </tr>
                {% else %}<tr><td colspan="4">No workers yet.</td></tr>{% endfor %}
            </table>
        </div>
    </div>
</body>
</html>
