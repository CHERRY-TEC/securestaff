<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Add Worker - SecureStaff</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; margin: 0; }
        .box { max-width: 420px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        input, textarea { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        .btn { background: #e94560; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; }
        a { color: #e94560; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Add Security Worker</h2>
        <form method="post">
            <input name="name" placeholder="Full Name" required>
            <input name="email" type="email" placeholder="Email" required>
            <input name="password" type="password" placeholder="Password" required>
            <input name="phone" placeholder="Phone">
            <textarea name="skills" placeholder="Skills (e.g. Armed Guard, CCTV, Patrol)" rows="2"></textarea>
            <button class="btn" type="submit">Add Worker</button>
        </form>
        <p><a href="/workers">Back to Workers</a></p>
    </div>
</body>
</html>
