<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Company Portal - SecureStaff</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #1a1a2e; color: #fff; }
        .center { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { text-align: center; }
        h1 { font-size: 48px; margin-bottom: 10px; }
        p { font-size: 18px; color: #ccc; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 14px 32px; margin: 10px; border-radius: 6px; text-decoration: none; font-size: 18px; font-weight: bold; }
        .login { background: #e94560; color: #fff; }
        .login:hover { background: #c0392b; }
        .register { background: transparent; color: #e94560; border: 2px solid #e94560; }
        .register:hover { background: #e94560; color: #fff; }
    </style>
</head>
<body>
    <div class="center">
        <div class="box">
            <h1>SecureStaff</h1>
            <p>Company Portal — Manage security workers and jobs</p>
            <a class="btn login" href="/login">Login</a>
            <a class="btn register" href="/register">Register</a>
        </div>
    </div>
</body>
</html>
