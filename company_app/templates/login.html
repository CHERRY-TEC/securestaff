<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Company Login - SecureStaff</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; margin: 0; }
        .box { max-width: 360px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        .btn { background: #e94560; color: #fff; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .msg { color: #c0392b; }
        a { color: #e94560; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Company Login</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<p class="msg">{{ messages[0] }}</p>{% endif %}
        {% endwith %}
        <form method="post">
            <input name="email" type="email" placeholder="Email" required>
            <input name="password" type="password" placeholder="Password" required>
            <button class="btn" type="submit">Login</button>
        </form>
        <p><a href="/register">Register</a> | <a href="/">Back</a></p>
    </div>
</body>
</html>
